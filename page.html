    <!-- Detect OS theme -->
    <script>
   (function () {
        const saved = localStorage.getItem('theme'); // 'light' | 'dark' | null
        if (saved) {
          document.documentElement.setAttribute('data-theme', saved);
        }
      })();
    </script>
    <!-- MathJax -->
    <script>
   window.MathJax = {
      tex: {

        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      }
    };
    </script>
